[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universe-gen"
version = "0.1.0"
description = "A staged universe-generation pipeline for procedurally modeling astrophysical structures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Universe Gen Contributors" },
]
dependencies = [
  "astropy>=6.0",
  "click>=8.1",
  "jsonschema>=4.0",
  "numpy>=1.26",
  "pydantic>=2.0",
]

[project.scripts]
universe-gen = "universe_gen.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["universe_gen"]
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
